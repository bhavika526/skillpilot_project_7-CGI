# Apache configuration for the C++ CGI greeting program
# ------------------------------------------------------
# XAMPP on Windows usually has the ScriptAlias line already.
# File to check: C:\xampp\apache\conf\httpd.conf

# 1. Map the URL /cgi-bin/ to the folder that holds the compiled program
ScriptAlias /cgi-bin/ "C:/xampp/cgi-bin/"

# 2. Allow programs in that folder to be executed as CGI
<Directory "C:/xampp/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>